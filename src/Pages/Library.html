<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="icon" href="https://fav.mhciael.com/📦">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700&display=swap">
    <link rel="stylesheet" href="../Styles/style.css">
    <link rel="stylesheet" href="../Styles/style_library.css">
</head>

<body>
    <header>
        <!-- Title Bar -->
        <h1 class="title">📦Library</h1>
        <!-- nav section -->
        <nav class="nav">
            <ul class="nav-list">
                <li><a href="./index.html">CRUDBuilder</a></li>
                <li><a href="./search.html">Search</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="library-content">
            <div id="library-header">
                <h2>Deck Library</h2>
            </div>
            <!-- Deck library content goes here -->
            <div id="deck-library">
                <!-- Deck items will be dynamically added here -->
                <div id="favorites" class="hidden">
                    <h3>Favorties</h3>
                    <ul class="decklist" id="favorite-decks">
                    </ul>
                </div>
                <div id="standard" class="hidden">
                    <h3>Standard</h3>
                    <ul class="decklist" id="standard-decks">
                    </ul>
                </div>
                <div id="modern" class="hidden">
                    <h3>Modern</h3>
                    <ul class="decklist" id="modern-decks">
                    </ul>
                </div>
                <div id="commander" class="hidden">
                    <h3>Commander</h3>
                    <ul class="decklist" id="commander-decks">
                    </ul>
                </div>
                <div id="pauper" class="hidden">
                    <h3>Pauper</h3>
                    <ul class="decklist" id="pauper-decks">
                    </ul>
                </div>
            </div>
        </section>
        <template id="deck-template">
            <div class="deck-item">
                <img src="../Images/Default_Deck_Image.png" alt="Deck Image" class="deck-image">
                <h4 class="deck-name"></h4>
                <button id="edit-button" type="submit">Add Deck Image</button>
            </div>
        </template>
        <dialog id="image-upload-dialog">
            <form id="submit-image-form">
                <label for="image-url-input">Enter Image URL:</label>
                <input type="text" id="image-url-input" placeholder="https://example.com/image.jpg" required>
                <button type="submit" id="upload-submit">Upload</button>
                <button type="submit" id="image-submit">Submit</button>
                <button type="button" id="cancel-button">Cancel</button>
            </form>
            <div id="image-preview-area">
                <label for="image-preview">Image Preview:</label>
                <img id="image-preview" src="" alt="Image Preview" class="hidden">
            </div>
        </dialog>
    </main>

</body>

<script src="../Scripts/library.js"></script>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="icon" href="https://fav.mhciael.com/📦">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700&display=swap">
    <link rel="stylesheet" href="../Styles/style.css">
    <link rel="stylesheet" href="../Styles/style_library.css">
</head>

<body>
    <header>
        <!-- Title Bar -->
        <h1 class="title">📦CRUDBuilder</h1>
        <!-- nav section -->
        <nav class="nav">
            <ul class="nav-list">
                <li>
                    <img src="../Icons/home-svgrepo-com-white.svg" alt="Home Icon">
                    <a href="../index.html">Home</a>
                </li>
                <li>
                    <img src="../Icons/library-svgrepo-com-white.svg" alt="Library Icon">
                    <p>Library</p>
                </li>
                <li>
                    <img src="../Icons/search-left-1506-svgrepo-com-inverted.svg" alt="Search Icon">
                    <a href="./search.html">Search</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="library-content">
            <div id="library-header">
                <h2>Deck Library</h2>
            </div>
            <!-- Deck library content goes here -->
            <div id="deck-library">
                <!-- Deck items will be dynamically added here -->
                <div id="favorites" class="hidden">
                    <h3>Favorties</h3>
                    <ul class="decklist" id="favorite-decks">
                    </ul>
                </div>
                <div id="standard" class="hidden">
                    <h3>Standard</h3>
                    <ul class="decklist" id="standard-decks">
                    </ul>
                </div>
                <div id="modern" class="hidden">
                    <h3>Modern</h3>
                    <ul class="decklist" id="modern-decks">
                    </ul>
                </div>
                <div id="legacy" class="hidden">
                    <h3>Legacy</h3>
                    <ul class="decklist" id="legacy-decks">
                    </ul>
                </div>
                <div id="commander" class="hidden">
                    <h3>Commander</h3>
                    <ul class="decklist" id="commander-decks">
                    </ul>
                </div>
                <div id="pauper" class="hidden">
                    <h3>Pauper</h3>
                    <ul class="decklist" id="pauper-decks">
                    </ul>
                </div>
            </div>
        </section>
        <template id="deck-template">
            <div class="item">
                <a href="#" class="deck-item" aria-label="Interactive Deck Element">
                    <img src="../Images/Default_Deck_Image.png" alt="Deck Image" class="deck-image"
                        aria-label="Deck Image">
                    <h4 class="deck-name"></h4>
                    <div class="deck-controls">
                        <button class="edit-button" type="submit">Add Deck Image</button>
                        <button class="delete-button" type="submit">Delete Deck</button>
                    </div>
                </a>
            </div>
        </template>
        <dialog id="image-upload-dialog">
            <form id="submit-image-form">
                <label for="image-url-input">Enter Image URL:</label>
                <input type="text" id="image-url-input" placeholder="https://example.com/image.jpg" required>
                <button type="submit" id="upload-submit">Upload</button>
                <button type="submit" id="image-submit">Submit</button>
                <button type="button" id="cancel-button">Cancel</button>
            </form>
            <div id="image-preview-area">
                <p>Image Preview:</p>
                <img id="image-preview" src="../Images/Default_Deck_Image.png" alt="Image Preview" class="hidden"
                    aria-label="Upload Images to Preview how they look">
            </div>
        </dialog>
    </main>

</body>

<script src="../Scripts/library.js"></script>

</html>

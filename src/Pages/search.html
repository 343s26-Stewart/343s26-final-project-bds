<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>
    <link rel="icon" href="https://fav.mhciael.com/📦">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700&display=swap">
    <link rel="stylesheet" href="../Styles/style.css">
    <link rel="stylesheet" href="../Styles/style_search.css">
</head>

<body>

    <header>
        <!-- Title Bar -->
        <h1 class="title">📦CRUDBuilder</h1>
        <!-- nav section -->
        <nav class="nav">
            <ul class="nav-list">
                <li>
                    <img src="../Icons/home-svgrepo-com-white.svg" alt="Home">
                    <a href="./index.html">Home</a>
                </li>
                <li>
                    <img src="../Icons/library-svgrepo-com-white.svg" alt="Library">
                    <a href="./library.html">Library</a>
                </li>
                <li>
                    <img src="../Icons/search-left-1506-svgrepo-com-inverted.svg" alt="Search">
                    <p>Search</p>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="decklist">
            <h2>Deck List</h2>
            <h3 id="favorites">Favorites</h3>
            <ul id="favorite-list">

            </ul>
            <h3 id="Your-Decks">Your Decks</h3>
            <ul id="deck-list-items">
                <!-- Deck list items will be dynamically added here -->
            </ul>
        </section>
        <!-- Search Section -->
        <section class="search-section">
            <h2>Search for Cards</h2>
            <section id="operations">
                <form id="search-form">
                    <label for="search-input">Enter Search Term:</label>
                    <input type="text" id="search-input" placeholder="Enter card name..." required>
                    <button type="submit" id="search-submit">Search</button>
                </form>
                <button type="submit" id="shareable-url">Get Shareable URL</button>
                <form id="filter-form">
                    <section id="generals">
                        <label for="card-name">Card Name: </label>
                        <input type="text" id="card-name" name="card-name" value=""> <!-- name -->
                        <label for="CMC">CMC:</label>
                        <input type="number" id="CMC" name="CMC" value=""> <!-- CMC -->

                    </section>
                    <section id="color-identity">
                        <label for="red-identity">Red: </label>
                        <input type="checkbox" id="red-identity" name="red-identity" value="true"> <!-- Colors -->
                        <label for="blue-identity">Blue: </label>
                        <input type="checkbox" id="blue-identity" name="blue-identity" value="true">
                        <label for="black-identity">Black: </label>
                        <input type="checkbox" id="black-identity" name="black-identity" value="true">
                        <label for="white-identity"> White:</label>
                        <input type="checkbox" id="white-identity" name="white-identity" value="true">
                        <label for="green-identity">Green: </label>
                        <input type="checkbox" id="green-identity" name="green-identity" value="true">

                    </section>
                    <section id="type-selection">
                        <section id="creature-specifics">
                            <label for="creature-type">Creature: </label>
                            <input type="checkbox" id="creature-type" name="creature-type" value="creature">
                            <!-- Type -->

                            <label for="specific-creature-type">Creature Type: </label>
                            <input type="text" id="specific-creature-type" name="specific-creature-type" value="">
                            <!-- Creature Type -->

                        </section>
                        <label for="instant-type">Instant: </label>
                        <input type="checkbox" id="instant-type" name="instant-type" value="instant">
                        <label for="sorcery-type">Sorcery: </label>
                        <input type="checkbox" id="sorcery-type" name="sorcery-type" value="sorcery">
                        <label for="artifact-type">Artifact: </label>
                        <input type="checkbox" id="artifact-type" name="artifact-type" value="artifact">
                        <label for="enchantment-type">Enchantment: </label>
                        <input type="checkbox" id="enchantment-type" name="enchantment-type" value="enchantment">
                        <label for="planeswalker-type">Planeswalker: </label>
                        <input type="checkbox" id="planeswalker-type" name="planeswalker-type" value="planeswalker">

                    </section>
                    <button type="submit" id="submit-filter">Filter Results</button>
                </form>
            </section>
            <section id="loading-indicator" class="hidden">
            </section>
            <section id="error-message" class="hidden">
            </section>
            <section id="search-results">
                <!-- Search results will be displayed here -->
                <template id="card-template">
                    <div class="card-result">
                        <figure>
                            <img src="../Images/Default_Deck_Image.png" alt="Card Image" class="card-image">
                            <figcaption class="card-name"></figcaption>
                        </figure>
                    </div>
                </template>
            </section>
            <section id="content-scroll-buttons">
                <button id="scroll-left" class="scroll-button hidden">←</button>
                <button id="scroll-right" class="scroll-button hidden">→</button>
            </section>
        </section>

    </main>

</body>

<script src="../Scripts/query_function.js"></script>
<script src="../Scripts/search_page.js"></script>

</html>
